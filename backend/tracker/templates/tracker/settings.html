<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Technician Dashboard | Cleanroom Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent-red: #a51c30;
      --bg-softest: #f8f6f3;
      --panel-bg: #f6f3f0;
      --text-dark: #1A1A1A;
    }
    .font-playfair { font-family: 'Playfair Display', serif; }
    .font-inter { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="font-inter font-semibold bg-[var(--bg-softest)] text-[var(--text-dark)] min-h-screen h-screen flex flex-col">

  <!-- Top Bar -->
  <header class="bg-[var(--panel-bg)] shadow-md px-6 py-4 flex justify-between items-center h-[72px] border-b border-gray-300 relative">
    <h1 class="text-2xl font-playfair text-[var(--accent-red)]">Dashboard</h1>
    <div class="flex items-center gap-6 relative">
      <!-- ✅ Updated calendar icon link -->
      <a href="{% url 'calendar' %}" class="hover:text-[var(--accent-red)] transition hover:scale-110">
        <i data-lucide="calendar" class="w-6 h-6"></i>
      </a>
      <a href="settings.html" class="hover:text-[var(--accent-red)] transition hover:scale-110">
        <i data-lucide="settings" class="w-6 h-6"></i>
      </a>

      <!-- Profile Dropdown with Logout -->
      <div class="relative">
        <button id="profileBtn" class="hover:text-[var(--accent-red)] transition hover:scale-110 focus:outline-none">
          <i data-lucide="user-circle" class="w-6 h-6"></i>
        </button>
        <div id="dropdownMenu" class="hidden absolute right-0 mt-2 w-44 bg-white border border-gray-200 rounded shadow-md z-50">
          <div class="px-4 py-2 text-sm text-gray-600 border-b">Hello, {{ request.user.username }}</div>
          <a href="{% url 'logout' %}" class="block px-4 py-2 text-sm text-red-600 hover:bg-gray-100">Logout</a>
        </div>
      </div>
    </div>
  </header>


  <!-- Main Layout -->
  <main class="flex-1 flex flex-col lg:flex-row overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-full lg:w-1/5 bg-[var(--panel-bg)] border-r border-gray-300 p-6 overflow-y-auto">
      <nav class="flex flex-col gap-4 text-[var(--text-dark)]">
        <a href="{% url 'tech_project_list' %}" class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-[#f4e8e7] hover:text-[var(--accent-red)] transition-all">
          <i data-lucide="folder" class="w-5 h-5"></i> <span>Projects</span>
        </a>
        {% for project in projects %}
        <a href="{% url 'tech_project_detail' project.id %}" class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-[#f4e8e7] hover:text-[var(--accent-red)] transition-all">
          <i data-lucide="dot" class="w-5 h-5"></i> <span>{{ project.name }}</span>
        </a>
        {% empty %}
        <p class="text-sm text-gray-400 px-3">No projects</p>
        {% endfor %}
        <a href="{% url 'tech_tasks' %}" class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-[#f4e8e7] hover:text-[var(--accent-red)] transition-all">
          <i data-lucide="list-todo" class="w-5 h-5"></i> <span>My Tasks</span>
        </a>
        <a href="{% url 'tech_components' %}" class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-[#f4e8e7] hover:text-[var(--accent-red)] transition-all">
          <i data-lucide="package" class="w-5 h-5"></i> <span>Components</span>
        </a>
        {% if projects %}
        <a href="{% url 'project_messages' projects.0.id %}" class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-[#f4e8e7] hover:text-[var(--accent-red)] transition-all">
          <i data-lucide="messages-square" class="w-5 h-5"></i> <span>Messages</span>
        </a>
        {% else %}
        <span class="flex items-center gap-3 px-3 py-2 rounded-md text-gray-400 cursor-not-allowed">
          <i data-lucide="messages-square" class="w-5 h-5"></i> <span>Messages</span>
        </span>
        {% endif %}
        <a href="{% url 'alerts' %}" class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-[#f4e8e7] hover:text-[var(--accent-red)] transition-all">
          <i data-lucide="bell" class="w-5 h-5"></i> <span>Alerts</span>
        </a>
      </nav>
    </aside>
    
    <!-- Settings Content -->
    <section class="flex-1 overflow-y-auto p-6">
      <h2 class="text-2xl font-bold text-[var(--accent-red)] mb-6">Settings</h2>

      <form method="POST" class="space-y-6">
        {% csrf_token %}
        <!-- Dark Mode Toggle -->
        <div class="flex items-center justify-between">
          <label for="darkModeToggle" class="text-sm font-medium text-gray-800">Enable Dark Mode</label>
          <input type="checkbox" id="darkModeToggle" name="dark_mode" class="w-5 h-5 text-[var(--accent-red)] rounded border-gray-300 focus:ring-[var(--accent-red)]">
        </div>

        <!-- Notification Settings -->
        <div>
          <label class="block text-sm font-medium text-gray-800 mb-2">Email Notifications</label>
          <div class="flex flex-col gap-2">
            <label class="flex items-center gap-2">
              <input type="checkbox" name="notify_tasks" class="rounded border-gray-300 text-[var(--accent-red)]">
              <span class="text-sm">Task Updates</span>
            </label>
            <label class="flex items-center gap-2">
              <input type="checkbox" name="notify_components" class="rounded border-gray-300 text-[var(--accent-red)]">
              <span class="text-sm">Component Changes</span>
            </label>
          </div>
        </div>

        <!-- Save Button -->
        <button type="submit" class="px-5 py-2 bg-[var(--accent-red)] text-white rounded-md shadow hover:opacity-90 transition">Save Changes</button>
      </form>
    </section>


  <script>
    document.addEventListener("DOMContentLoaded", function () {
      lucide.createIcons();

      const profileBtn = document.getElementById('profileBtn');
      const dropdownMenu = document.getElementById('dropdownMenu');

      if (profileBtn && dropdownMenu) {
        profileBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          dropdownMenu.classList.toggle('hidden');
        });

        document.addEventListener('click', function (e) {
          if (!dropdownMenu.contains(e.target) && !profileBtn.contains(e.target)) {
            dropdownMenu.classList.add('hidden');
          }
        });
      }
    });
  </script>
</body>
</html>
