<!DOCTYPE html>
<html>
<head>
  <title>Task Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#fef9f9] text-gray-800 p-8 font-sans">
  <div class="max-w-4xl mx-auto bg-white p-6 rounded shadow border border-red-100">
    <h2 class="text-2xl font-bold text-[#a51c30] mb-6">Preview Tasks Before Creating</h2>

    <ul class="space-y-4 mb-8">
      {% for task in tasks %}
      <li class="border border-gray-200 p-4 rounded bg-gray-50 relative">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <div>
            <h3 class="font-semibold text-lg">{{ task.title }}</h3>
            <p class="text-sm text-gray-600">{{ task.description }}</p>
            {% if task.section %}
            <p class="text-xs text-gray-400 mt-1">Section {{ task.section }}</p>
            {% endif %}
          </div>
          <div class="flex gap-2">
            <a href="{% url 'edit_preview_task' index=forloop.counter0 %}" 
               class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-3 py-1 rounded">
              Edit
            </a>
            <button type="button"
              class="bg-green-600 hover:bg-green-700 text-white text-sm px-3 py-1 rounded"
              onclick="openAssignModal({{ forloop.counter0 }}, '{{ task.title }}', '{{ task.description }}', '{{ task.section }}')">
              Assign
            </button>
          </div>
        </div>
      </li>
      {% endfor %}
    </ul>
  </div>

  <!-- Assignment Modal -->
  <div id="assignModal" class="fixed inset-0 bg-black bg-opacity-40 hidden flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded-md w-full max-w-md shadow-md">
      <h3 class="text-xl font-bold mb-4 text-[#a51c30]">Assign Task</h3>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-semibold mb-1">Assign To</label>
          <select id="modal-user" class="w-full border border-gray-300 p-2 rounded" autocomplete="off">
            {% for user in users %}
              <option value="{{ user.id }}">{{ user.get_full_name }}</option>
            {% empty %}
              <option disabled selected>No technicians available</option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold mb-1">Due Date</label>
          <input type="date" id="modal-due" class="w-full border border-gray-300 p-2 rounded" autocomplete="off">
        </div>

        <div>
          <label class="block text-sm font-semibold mb-1">Component</label>
          <select id="modal-component" class="w-full border border-gray-300 p-2 rounded" autocomplete="off">
            {% for component in components %}
              <option value="{{ component.id }}">{{ component.name }}</option>
            {% empty %}
              <option disabled selected>No active components found</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="mt-6 flex justify-end gap-2">
        <button type="button" onclick="closeAssignModal()" class="px-4 py-2 border border-gray-300 rounded">Cancel</button>
        <button type="button" onclick="saveAssignment()" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">
          Save
        </button>
      </div>
    </div>
  </div>

  <!-- JS for modal assignment -->
  <script>
    let currentTask = {
      index: null,
      title: '',
      description: '',
      section: ''
    };

    function openAssignModal(index, title, description, section) {
      currentTask.index = index;
      currentTask.title = title;
      currentTask.description = description;
      currentTask.section = section;
      document.getElementById('assignModal').classList.remove('hidden');
    }

    function closeAssignModal() {
      document.getElementById('assignModal').classList.add('hidden');
      currentTask.index = null;
    }

    function saveAssignment() {
      const user = document.getElementById('modal-user').value;
      const due = document.getElementById('modal-due').value;
      const component = document.getElementById('modal-component').value;
      const project = "{{ related_project_id }}";

      fetch("{% url 'assign_single_task' %}", {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': '{{ csrf_token }}'
        },
        body: JSON.stringify({
          title: currentTask.title,
          description: currentTask.description,
          section: currentTask.section,
          user: user,
          due_date: due,
          component: component,
          project: project
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          alert('✅ Task created successfully!');
        } else {
          alert('⚠️ Error: ' + data.error);
        }
      })
      .catch(error => {
        alert('❌ Something went wrong.');
        console.error(error);
      });

      closeAssignModal();
    }
  </script>
</body>
</html>
