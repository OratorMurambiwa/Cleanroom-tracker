<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Calendar | Cleanroom Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <style>
    :root {
      --accent-red: #a51c30;
      --bg-softest: #f8f6f3;
      --panel-bg: #f6f3f0;
    }
  </style>
</head>

<body class="bg-[var(--bg-softest)] font-inter p-8 text-[#1A1A1A]">

  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
    <h1 class="text-2xl font-bold text-[var(--accent-red)]">📅 Calendar</h1>
    <div class="flex gap-3">
      <button id="openModalBtn" class="bg-[var(--accent-red)] text-white px-4 py-2 rounded hover:bg-red-700 transition">
        Set Reminder
      </button>
      <a href="{% url 'assign_tasks' %}" class="bg-[var(--accent-red)] text-white px-4 py-2 rounded hover:bg-red-700 transition">
        Add Task
      </a>
    </div>
  </div>

  <!-- Calendar -->
  <div id="calendar" class="bg-white p-4 rounded shadow border border-[#e7c2c4]"></div>

  <!-- Modal Overlay -->
  <div id="modalOverlay" class="fixed inset-0 bg-black/50 hidden justify-center items-center z-50">
    <div class="bg-white w-full max-w-md rounded-lg shadow-lg p-6 relative">
      <button id="closeModalBtn" class="absolute top-3 right-3 text-gray-500 hover:text-red-600 text-2xl font-bold">&times;</button>
      <h2 class="text-lg font-semibold text-[var(--accent-red)] mb-4">New Reminder</h2>

      <form method="POST" action="{% url 'create_reminder' %}" class="space-y-4">
        {% csrf_token %}
        <div>
          <label class="block mb-1 font-semibold">Title</label>
          <input type="text" name="title" required class="w-full px-3 py-2 border rounded">
        </div>

        <div>
          <label class="block mb-1 font-semibold">Time</label>
          <input type="datetime-local" name="reminder_time" required class="w-full px-3 py-2 border rounded">
        </div>

        <div>
          <label class="block mb-1 font-semibold">Note</label>
          <textarea name="note" rows="3" class="w-full px-3 py-2 border rounded"></textarea>
        </div>

        <div class="text-right">
          <button type="submit" class="bg-[var(--accent-red)] text-white px-4 py-2 rounded hover:bg-red-700 transition">
            Add Reminder
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const calendarEl = document.getElementById('calendar');
      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        height: 600,
        events: [
          {% for task in tasks %}
            {
              title: "{{ task.title|escapejs }}",
              start: "{{ task.due_date|date:'Y-m-d' }}",
              color: "{% if task.is_completed %}green{% elif task.due_date < today %}red{% else %}orange{% endif %}",
              url: "{% url 'task_detail' task.id %}"
            },
          {% endfor %}
          {% for reminder in reminders %}
            {
              title: "🔔 {{ reminder.title|escapejs }}",
              start: "{{ reminder.reminder_time|date:'Y-m-d\\TH:i:s' }}",
              color: "blue"
            },
          {% endfor %}
        ]
      });
      calendar.render();

      // Modal logic
      const openModal = document.getElementById('openModalBtn');
      const closeModal = document.getElementById('closeModalBtn');
      const overlay = document.getElementById('modalOverlay');

      openModal.addEventListener('click', () => {
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
      });

      closeModal.addEventListener('click', () => {
        overlay.classList.add('hidden');
      });

      // Optional: Close modal when clicking outside
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) {
          overlay.classList.add('hidden');
        }
      });
    });
  </script>
</body>
</html>
