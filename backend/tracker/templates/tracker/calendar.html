<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Calendar | Cleanroom Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

  <style>
    :root {
      --accent-red: #a51c30;
      --bg-softest: #f8f6f3;
      --panel-bg: #f6f3f0;
    }
    body { color: #1A1A1A; }
    .modal-show { display: flex !important; }
  </style>
</head>

<body class="bg-[var(--bg-softest)] font-inter p-8">

  <!-- Header -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
    <h1 class="text-2xl font-bold text-[var(--accent-red)]">📅 Calendar</h1>
    <div class="flex gap-3">
      <button id="openModalBtn" class="bg-[var(--accent-red)] text-white px-4 py-2 rounded hover:bg-red-700 transition">
        Set Reminder
      </button>
      {% if is_lead %}
        <a href="{% url 'assign_tasks' %}" class="bg-[var(--accent-red)] text-white px-4 py-2 rounded hover:bg-red-700 transition">
          Add Task
        </a>
      {% endif %}
    </div>
  </div>

  <!-- Calendar -->
  <div id="calendar" class="bg-white p-4 rounded shadow border border-[#e7c2c4]"></div>

  <!-- Reminder Modal -->
  <div id="modalOverlay" class="fixed inset-0 bg-black/50 hidden justify-center items-center z-50">
    <div class="bg-white w-full max-w-md rounded-lg shadow-lg p-6 relative">
      <button id="closeModalBtn" class="absolute top-3 right-3 text-gray-500 hover:text-red-600 text-2xl font-bold" aria-label="Close dialog">&times;</button>
      <h2 class="text-lg font-semibold text-[var(--accent-red)] mb-4">New Reminder</h2>

      <form method="POST" action="{% url 'create_reminder' %}" class="space-y-4">
        {% csrf_token %}
        <div>
          <label class="block mb-1 font-semibold" for="rem-title">Title</label>
          <input id="rem-title" type="text" name="title" required class="w-full px-3 py-2 border rounded">
        </div>

        <div>
          <label class="block mb-1 font-semibold" for="rem-time">Time</label>
          <input id="rem-time" type="datetime-local" name="reminder_time" required class="w-full px-3 py-2 border rounded">
        </div>

        <div>
          <label class="block mb-1 font-semibold" for="rem-note">Note</label>
          <textarea id="rem-note" name="note" rows="3" class="w-full px-3 py-2 border rounded"></textarea>
        </div>

        <div class="text-right">
          <button type="submit" class="bg-[var(--accent-red)] text-white px-4 py-2 rounded hover:bg-red-700 transition">
            Add Reminder
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Task Details Modal (kept) -->
  <div id="taskModal" class="fixed inset-0 bg-black/50 hidden justify-center items-center z-50">
    <div class="bg-white w-full max-w-lg rounded-lg shadow-lg p-6 relative">
      <button id="taskCloseBtn" class="absolute top-3 right-3 text-gray-500 hover:text-red-600 text-2xl font-bold" aria-label="Close dialog">&times;</button>
      <h2 class="text-xl font-bold text-[var(--accent-red)] mb-2" id="taskTitle">Task</h2>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm">
        <div>
          <div class="font-semibold">Project</div>
          <div id="taskProject" class="text-gray-700">—</div>
        </div>
        <div>
          <div class="font-semibold">Assignee</div>
          <div id="taskAssignee" class="text-gray-700">—</div>
        </div>
        <div>
          <div class="font-semibold">Due Date</div>
          <div id="taskDue" class="text-gray-700">—</div>
        </div>
        <div>
          <div class="font-semibold">Status</div>
          <div id="taskStatus" class="text-gray-700">—</div>
        </div>
        <div>
          <div class="font-semibold">Priority</div>
          <div id="taskPriority" class="text-gray-700">—</div>
        </div>
      </div>

      <div class="mt-4">
        <div class="font-semibold">Description</div>
        <div id="taskDescription" class="text-gray-700 whitespace-pre-wrap mt-1">—</div>
      </div>

      <div class="mt-6 flex justify-end gap-2">
        <!-- This button’s href will be set based on role (lead vs tech) -->
        <a id="taskOpenBtn"
           href="#"
           class="inline-block bg-[var(--accent-red)] text-white px-4 py-2 rounded hover:bg-red-700 transition">
          Open Task
        </a>
        <button id="taskCloseBtn2"
                class="inline-block bg-gray-200 text-gray-800 px-4 py-2 rounded hover:bg-gray-300 transition">
          Close
        </button>
      </div>
    </div>
  </div>
  <!-- Reminder Details Modal -->
  <div id="reminderModal" class="fixed inset-0 bg-black/50 hidden justify-center items-center z-50">
    <div class="bg-white w-full max-w-md rounded-lg shadow-lg p-6 relative">
      <button id="remCloseBtn" class="absolute top-3 right-3 text-gray-500 hover:text-red-600 text-2xl font-bold" aria-label="Close dialog">&times;</button>
      <h2 class="text-xl font-bold text-[var(--accent-red)] mb-2" id="remTitle">Reminder</h2>
      <div class="text-sm mb-4">
        <div class="font-semibold">When</div>
        <div id="remTime" class="text-gray-700">—</div>
      </div>
      <div class="mt-4 flex justify-end gap-2">
        <a id="remDeleteLink" href="#" class="inline-block bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700 transition">Delete</a>
        <button id="remCloseBtn2" class="inline-block bg-gray-200 text-gray-800 px-4 py-2 rounded hover:bg-gray-300 transition">Close</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const calendarEl = document.getElementById('calendar');

      // Role flag into JS (true for leads/staff/superusers you marked as leads)
      const IS_LEAD = {{ is_lead|yesno:"true,false" }};

      // Build review URL client-side to avoid misrouting
      function reviewUrlFor(id) {
        const num = parseInt(id, 10);
        if (!Number.isFinite(num) || num < 1) return null;
        return `/tasks/${num}/review/`;
      }
      function deleteReminderUrlFor(id) {
        const num = parseInt(id, 10);
        if (!Number.isFinite(num) || num < 1) return null;
        return `/delete_reminder/${num}/`;
      }

      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        height: 600,
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek'
        },
        eventClick: function(info) {
          if (info.jsEvent) info.jsEvent.preventDefault();

          // Fill the popup with details (unchanged)
          const p = info.event.extendedProps || {};
          // Show Reminder modal if reminder
          if (p.reminderId) {
            document.getElementById('remTitle').textContent = info.event.title || 'Reminder';
            document.getElementById('remTime').textContent = info.event.start ? info.event.start.toLocaleString() : '—';
            const link = document.getElementById('remDeleteLink');
            link.href = deleteReminderUrlFor(p.reminderId) || '#';
            const rModal = document.getElementById('reminderModal');
            rModal.classList.remove('hidden');
            rModal.classList.add('modal-show');
            return;
          }
          document.getElementById('taskTitle').textContent = info.event.title || 'Task';
          document.getElementById('taskProject').textContent = p.project || '—';
          document.getElementById('taskAssignee').textContent = p.assignee || '—';
          document.getElementById('taskDue').textContent = info.event.start ? info.event.start.toLocaleString() : '—';
          document.getElementById('taskStatus').textContent = p.status || '—';
          document.getElementById('taskPriority').textContent = p.priority || '—';
          document.getElementById('taskDescription').textContent = p.description || '—';

          // Route the Open button based on role, only if we have a valid numeric taskId
          const taskId = info.event.id || p.taskId;
          const openBtn = document.getElementById('taskOpenBtn');

          const nextHref = reviewUrlFor(taskId);
          openBtn.href = nextHref || p.detailUrl || info.event.url || '#';

          // Show the modal
          const tModal = document.getElementById('taskModal');
          tModal.classList.remove('hidden');
          tModal.classList.add('modal-show');
        },
        events: [
          {% for task in tasks %}
            {
              id: "{{ task.id }}",
              title: "{{ task.title|escapejs }}",
              start: "{{ task.due_date|date:'Y-m-d' }}",
              color: "{% if task.due_date <= today %}red{% elif task.due_date <= day_plus_5 and task.due_date > day_plus_2 %}orange{% elif task.due_date <= day_plus_2 %}orange{% else %}green{% endif %}",
              url: "{% url 'task_detail' task.id %}",  /* fallback link you already had */
              extendedProps: {
                project: "{{ task.project.name|default_if_none:''|escapejs }}",
                assignee: "{% if task.assigned_to %}{{ task.assigned_to.get_full_name|default:task.assigned_to.username|escapejs }}{% else %}{% endif %}",
                status: "{{ task.status|default_if_none:''|escapejs }}",
                priority: "{{ task.priority|default_if_none:''|escapejs }}",
                description: "{{ task.description|default_if_none:''|escapejs }}",
                detailUrl: "{% url 'task_detail' task.id %}"
              }
            },
          {% endfor %}
          {% for reminder in reminders %}
            {
              title: "🔔 {{ reminder.title|escapejs }}",
              start: "{{ reminder.reminder_time|date:'Y-m-d\\TH:i:s' }}",
              color: "blue",
              extendedProps: { reminderId: "{{ reminder.id }}" }
            },
          {% endfor %}
        ]
      });

      calendar.render();

      /* Reminder modal */
      const openModal = document.getElementById('openModalBtn');
      const closeModal = document.getElementById('closeModalBtn');
      const overlay = document.getElementById('modalOverlay');

      openModal.addEventListener('click', () => {
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
      });
      closeModal.addEventListener('click', () => {
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
      });
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) {
          overlay.classList.add('hidden');
          overlay.classList.remove('flex');
        }
      });

      /* Task modal close */
      const tModal = document.getElementById('taskModal');
      const tClose = document.getElementById('taskCloseBtn');
      const tClose2 = document.getElementById('taskCloseBtn2');

      function closeTaskModal() {
        tModal.classList.add('hidden');
        tModal.classList.remove('modal-show');
      }
      tClose.addEventListener('click', closeTaskModal);
      tClose2.addEventListener('click', closeTaskModal);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          overlay.classList.add('hidden'); overlay.classList.remove('flex');
          closeTaskModal();
        }
      });

      tModal.addEventListener('click', (e) => {
        if (e.target === tModal) {
          closeTaskModal();
        }
      });
      // Reminder modal close
      const rModal = document.getElementById('reminderModal');
      const rClose = document.getElementById('remCloseBtn');
      const rClose2 = document.getElementById('remCloseBtn2');
      function closeReminderModal() {
        rModal.classList.add('hidden');
        rModal.classList.remove('modal-show');
      }
      rClose.addEventListener('click', closeReminderModal);
      rClose2.addEventListener('click', closeReminderModal);
      rModal.addEventListener('click', (e) => { if (e.target === rModal) closeReminderModal(); });
    });
  </script>
</body>
</html>
