<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Component</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f4e7e5] min-h-screen flex items-center justify-center p-4">
  <div class="max-w-xl w-full bg-white p-6 rounded-xl shadow">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-xl font-bold text-[#a51c30]">Add Component to "{{ project.name }}"</h2>
    </div>
    <form method="post">
      {% csrf_token %}
      <div class="space-y-4">
        {{ form.as_p }}
        <div class="flex items-center gap-2">
          <button type="submit" class="bg-[#a51c30] text-white px-4 py-2 rounded">Add Component</button>
          <a href="{% url 'dashboard' %}" class="inline-flex items-center text-xs bg-[#5b4d40] text-white px-4 py-2 rounded hover:bg-[#3e2f27] transition">Return to Dashboard</a>
        </div>
      </div>
    </form>
  </div>
</body>
</html>
