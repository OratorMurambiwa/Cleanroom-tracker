<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login – LeinariX</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --accent-red: #a51c30;
      --bg-cream: #fdf8ee;
      --panel-cream: #fbf6eb;
      --text-dark: #1A1A1A;
    }
  </style>
</head>

<body class="bg-[var(--bg-cream)] text-[var(--text-dark)] min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-md bg-[var(--panel-cream)] rounded-lg shadow-lg p-8 border border-gray-200">
    <h2 class="text-2xl font-bold mb-6 text-center text-[var(--accent-red)]">Welcome Back</h2>

    <form method="POST" action="{% url 'custom_login' %}" class="space-y-4">
      {% csrf_token %}

      <div>
        <label for="username" class="block mb-1 font-semibold">Username</label>
        <input type="text" name="username" id="username" required
               class="w-full border border-gray-300 px-4 py-2 rounded focus:outline-none focus:ring-2 focus:ring-[var(--accent-red)]">
      </div>

      <div>
        <label for="password" class="block mb-1 font-semibold">Password</label>
        <input type="password" name="password" id="password" required
               class="w-full border border-gray-300 px-4 py-2 rounded focus:outline-none focus:ring-2 focus:ring-[var(--accent-red)]">
      </div>

      <div>
        <label for="role" class="block mb-1 font-semibold">Role</label>
        <select name="role" id="role"
                class="w-full border border-gray-300 px-4 py-2 rounded focus:outline-none focus:ring-2 focus:ring-[var(--accent-red)]">
          <option value="technician">Technician</option>
          <option value="projectlead">Lead</option>
        </select>
      </div>

      <button type="submit"
              class="w-full bg-[var(--accent-red)] text-white font-semibold py-2 rounded hover:bg-red-700 transition">
        Sign In
      </button>
    </form>

    {% if error %}
      <p class="mt-4 text-red-600 text-sm text-center">{{ error }}</p>
    {% endif %}

    <p class="mt-4 text-sm text-center text-gray-700">
      Don't have an account?
      <a href="{% url 'register' %}" class="text-[var(--accent-red)] hover:underline">Create one here</a>.
    </p>
  </div>

</body>
</html>
