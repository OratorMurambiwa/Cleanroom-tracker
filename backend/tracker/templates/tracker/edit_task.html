<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Project Lead Dashboard | Cleanroom Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent-red: #a51c30;
      --bg-softest: #f8f6f3;
      --panel-bg: #f6f3f0;
      --text-dark: #1A1A1A;
    }
    .font-playfair { font-family: 'Playfair Display', serif; }
    .font-inter { font-family: 'Inter', sans-serif; }
  </style>
</head>

<body class="font-inter font-semibold bg-[var(--bg-softest)] text-[var(--text-dark)] min-h-screen flex flex-col">

  <!-- Top Bar -->
  <header class="bg-[var(--panel-bg)] shadow-md px-6 py-4 flex justify-between items-center h-[72px] border-b border-gray-300 relative">
    <h1 class="text-2xl font-playfair text-[var(--accent-red)]">Dashboard</h1>
    <div class="flex items-center gap-6 relative">
      <a href="{% url 'calendar' %}" class="hover:text-[var(--accent-red)] transition hover:scale-110">
        <i data-lucide="calendar" class="w-6 h-6"></i>
      </a>
      <a href="{% url 'settings' %}" class="hover:text-[var(--accent-red)] transition hover:scale-110">
        <i data-lucide="settings" class="w-6 h-6"></i>
      </a>
      <!-- Profile Dropdown -->
      <div class="relative">
        <button id="profileBtn" class="hover:text-[var(--accent-red)] transition hover:scale-110 focus:outline-none">
          <i data-lucide="user-circle" class="w-6 h-6"></i>
        </button>
        <div id="dropdownMenu" class="hidden absolute right-0 mt-2 w-44 bg-white border border-gray-200 rounded shadow-md z-50">
          <div class="px-4 py-2 text-sm text-gray-600 border-b">Hello, {{ request.user.username }}</div>
          <a href="{% url 'logout' %}" class="block px-4 py-2 text-sm text-red-600 hover:bg-gray-100">Logout</a>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Layout -->
  <main class="flex-1 flex overflow-hidden min-h-[calc(100vh-72px)]">
    <!-- Sidebar -->
    <aside class="w-1/5 bg-[var(--panel-bg)] border-r border-gray-300 p-6 overflow-y-auto">
      <nav class="flex flex-col gap-4 text-[var(--text-dark)]">
        <a href="{% url 'project_list' %}" class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-[#f4e8e7] hover:text-[var(--accent-red)] transition-all">
          <i data-lucide="folder" class="w-5 h-5"></i> <span>Projects</span>
        </a>
        <a href="{% url 'all_tasks' %}" class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-[#f4e8e7] hover:text-[var(--accent-red)] transition-all">
          <i data-lucide="list-todo" class="w-5 h-5"></i> <span>Tasks</span>
        </a>
        <a href="{% url 'components' %}" class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-[#f4e8e7] hover:text-[var(--accent-red)] transition-all">
          <i data-lucide="package" class="w-5 h-5"></i> <span>Components</span>
        </a>
        {% if projects %}
        <a href="{% url 'project_messages' project_id=projects.0.id %}" class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-[#f4e8e7] hover:text-[var(--accent-red)] transition-all">
          <i data-lucide="messages-square" class="w-5 h-5"></i> <span>Messages</span>
        </a>
        {% endif %}
        <a href="alerts.html" class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-[#f4e8e7] hover:text-[var(--accent-red)] transition-all">
          <i data-lucide="bell" class="w-5 h-5"></i> <span>Alerts</span>
        </a>
      </nav>
    </aside>

    <!-- Task Edit Form -->
    <section class="flex-1 p-10">
      <div class="max-w-xl mx-auto bg-white border border-[#e7c2c4] rounded-lg p-6 shadow">
        <h1 class="text-2xl font-bold text-[#a51c30] mb-4">Edit Task</h1>
        <form method="POST">
          {% csrf_token %}

          <!-- Title Field -->
          <div class="mb-4">
            <label class="block text-sm text-gray-700 mb-1">Title</label>
            <input type="text" name="title" value="{{ task.title }}" class="w-full border px-3 py-2 rounded" required>
          </div>

          <!-- Description Field -->
          <div class="mb-4">
            <label class="block text-sm text-gray-700 mb-1">Description</label>
            <textarea name="description" rows="4" class="w-full border px-3 py-2 rounded">{{ task.description }}</textarea>
          </div>

          <!-- Notes Field -->
          <div class="mb-4">
            <label class="block text-sm text-gray-700 mb-1">Notes (optional)</label>
            <textarea name="notes" rows="3" class="w-full border px-3 py-2 rounded">{{ task.notes }}</textarea>
          </div>

          <!-- Deadline Field -->
          <div class="mb-4">
            <label class="block text-sm text-gray-700 mb-1">Deadline</label>
            <input type="date" name="due_date" value="{{ task.due_date|date:'Y-m-d' }}" class="w-full border px-3 py-2 rounded" />
          </div>

          <!-- Assigned Technician -->
          <div class="mb-4">
            <label class="block text-sm text-gray-700 mb-1">Assigned Technician</label>
            <select name="assigned_to" class="w-full border px-3 py-2 rounded">
              {% for tech in technicians %}
                <option value="{{ tech.id }}" {% if task.assigned_to.id == tech.id %}selected{% endif %}>{{ tech.username }}</option>
              {% endfor %}
            </select>
          </div>

          <!-- Linked Components -->
          <div class="mb-4">
            <label class="block text-sm text-gray-700 mb-1">Linked Components</label>
            <select name="components" multiple class="w-full border px-3 py-2 rounded text-sm focus:outline-none focus:ring-[#a51c30]">
              {% for comp in components %}
                <option value="{{ comp.id }}" {% if comp in task.components.all %}selected{% endif %}>
                  {{ comp.name }}
                </option>
              {% endfor %}
            </select>
            <p class="text-xs text-gray-500 mt-1">Hold Ctrl (Windows) or Cmd (Mac) to select multiple.</p>
          </div>

          <!-- Action Buttons -->
          <div class="flex justify-between items-center">
            <a href="{% url 'task_detail' task.id %}" class="text-sm text-gray-600 underline">&larr; Cancel</a>
            <button type="submit" class="bg-[#a51c30] text-white px-4 py-2 rounded hover:bg-red-700">Save Changes</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script>
    lucide.createIcons();
    const profileBtn = document.getElementById('profileBtn');
    const dropdownMenu = document.getElementById('dropdownMenu');

    profileBtn.addEventListener('click', () => {
      dropdownMenu.classList.toggle('hidden');
    });

    document.addEventListener('click', function (e) {
      if (!profileBtn.contains(e.target) && !dropdownMenu.contains(e.target)) {
        dropdownMenu.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
