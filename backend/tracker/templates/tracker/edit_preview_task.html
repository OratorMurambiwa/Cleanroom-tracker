<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edit Task | Cleanroom Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent-red: #a51c30;
      --bg-softest: #f8f6f3;
      --panel-bg: #f6f3f0;
      --text-dark: #1A1A1A;
    }
    .font-playfair { font-family: 'Playfair Display', serif; }
    .font-inter { font-family: 'Inter', sans-serif; }
  </style>
</head>

<body class="font-inter font-medium bg-[var(--bg-softest)] text-[var(--text-dark)] min-h-screen flex flex-col">

  <!-- Top Bar -->
  <header class="bg-[var(--panel-bg)] shadow-md px-6 py-4 flex justify-between items-center h-[72px] border-b border-gray-300">
    <h1 class="text-2xl font-playfair text-[var(--accent-red)]">Edit Task</h1>
    <div class="flex items-center gap-6">
      <a href="{% url 'calendar' %}" class="hover:text-[var(--accent-red)] transition hover:scale-110">
        <i data-lucide="calendar" class="w-6 h-6"></i>
      </a>
      <a href="{% url 'settings' %}" class="hover:text-[var(--accent-red)] transition hover:scale-110">
        <i data-lucide="settings" class="w-6 h-6"></i>
      </a>
      <div class="relative">
        <button id="profileBtn" class="hover:text-[var(--accent-red)] transition hover:scale-110">
          <i data-lucide="user-circle" class="w-6 h-6"></i>
        </button>
        <div id="dropdownMenu" class="hidden absolute right-0 mt-2 w-44 bg-white border border-gray-200 rounded shadow-md z-50">
          <div class="px-4 py-2 text-sm text-gray-600 border-b">Hello, {{ request.user.username }}</div>
          <a href="{% url 'logout' %}" class="block px-4 py-2 text-sm text-red-600 hover:bg-gray-100">Logout</a>
        </div>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="flex flex-1 min-h-[calc(100vh-72px)] overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-1/5 bg-[var(--panel-bg)] border-r border-gray-300 p-6 overflow-y-auto">
      <nav class="flex flex-col gap-4 text-[var(--text-dark)]">
        <a href="{% url 'project_list' %}" class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-[#f4e8e7] hover:text-[var(--accent-red)]">
          <i data-lucide="folder" class="w-5 h-5"></i> <span>Projects</span>
        </a>
        <a href="{% url 'assign_tasks' %}" class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-[#f4e8e7] hover:text-[var(--accent-red)]">
          <i data-lucide="list-todo" class="w-5 h-5"></i> <span>Tasks</span>
        </a>
        <a href="{% url 'components' %}" class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-[#f4e8e7] hover:text-[var(--accent-red)]">
          <i data-lucide="package" class="w-5 h-5"></i> <span>Components</span>
        </a>
        <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-[#f4e8e7] hover:text-[var(--accent-red)]">
          <i data-lucide="messages-square" class="w-5 h-5"></i> <span>Messages</span>
        </a>
        <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-[#f4e8e7] hover:text-[var(--accent-red)]">
          <i data-lucide="bell" class="w-5 h-5"></i> <span>Alerts</span>
        </a>
      </nav>
    </aside>

    <!-- Content -->
    <section class="flex-1 p-6 overflow-y-auto">
      <div class="max-w-3xl mx-auto bg-[var(--panel-bg)] p-6 rounded-xl border border-[#e7c2c4] shadow">

        <form method="post" enctype="multipart/form-data" class="space-y-5">
          {% csrf_token %}

          <div>
            <label class="block text-sm font-semibold mb-1">Title</label>
            <input type="text" name="title" value="{{ task.title }}" required class="w-full border border-gray-300 p-2 rounded">
          </div>

          <div>
            <label class="block text-sm font-semibold mb-1">Description</label>
            <textarea name="description" rows="3" required class="w-full border border-gray-300 p-2 rounded">{{ task.description }}</textarea>
          </div>

          <div>
            <label class="block text-sm font-semibold mb-1">Section (optional)</label>
            <input type="text" name="section" value="{{ task.section }}" class="w-full border border-gray-300 p-2 rounded">
          </div>

          <!-- Notes + Files -->
          <div>
            <label class="block text-sm font-semibold mb-1">Notes</label>
            <textarea name="notes" rows="3" class="w-full border border-gray-300 p-2 rounded" placeholder="Enter task notes..."></textarea>

            <label class="block text-xs font-medium text-gray-600 mt-2">Attach files (images, video, audio, docs)</label>
            <input type="file" name="attachments" multiple accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx" class="w-full border border-gray-300 p-2 rounded mt-1 bg-white text-sm">
          </div>

          <div class="flex justify-between">
            <a href="{% url 'preview_extracted_tasks' %}" class="text-sm text-gray-600 hover:underline">← Back</a>
            <div class="flex gap-2">
              <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded">Save</button>
              <button type="button" onclick="document.getElementById('assignModal').classList.remove('hidden')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">Assign</button>
            </div>
          </div>
        </form>
      </div>
    </section>
  </main>

  <!-- Assign Modal -->
  <div id="assignModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
    <div class="bg-white w-full max-w-md p-6 rounded shadow-lg border border-[#e7c2c4]">
      <h3 class="text-xl font-playfair text-[var(--accent-red)] mb-4">Assign Task</h3>

      <form method="post" action="{% url 'assign_single_task' %}">
        {% csrf_token %}
        <div class="mb-4">
          <label class="block text-sm font-semibold mb-1">Technician</label>
          <select name="assigned_to" class="w-full border border-gray-300 p-2 rounded">
            {% for user in users %}
              <option value="{{ user.id }}">{{ user.get_full_name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-4">
          <label class="block text-sm font-semibold mb-1">Component</label>
          <select name="component" class="w-full border border-gray-300 p-2 rounded">
            {% for component in components %}
              <option value="{{ component.id }}">{{ component.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-4">
          <label class="block text-sm font-semibold mb-1">Project</label>
          <select name="project" class="w-full border border-gray-300 p-2 rounded">
            {% for project in projects %}
              <option value="{{ project.id }}">{{ project.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-4">
          <label class="block text-sm font-semibold mb-1">Due Date</label>
          <input type="date" name="due_date" class="w-full border border-gray-300 p-2 rounded">
        </div>

        <div class="flex justify-end gap-2">
          <button type="button" onclick="document.getElementById('assignModal').classList.add('hidden')" class="px-4 py-2 border border-gray-300 rounded">Cancel</button>
          <button type="submit" class="bg-[var(--accent-red)] hover:bg-red-700 text-white px-4 py-2 rounded">Assign</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const profileBtn = document.getElementById('profileBtn');
    const dropdownMenu = document.getElementById('dropdownMenu');
    profileBtn.addEventListener('click', () => dropdownMenu.classList.toggle('hidden'));
    document.addEventListener('click', function (e) {
      if (!profileBtn.contains(e.target) && !dropdownMenu.contains(e.target)) {
        dropdownMenu.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
