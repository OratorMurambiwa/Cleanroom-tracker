services:
  # Main Django Web Service
  - type: web
    name: cleanroom-tracker
    env: python
    plan: starter
    buildCommand: |
      pip install -r requirements.txt
      pip install dj-database-url psycopg2-binary whitenoise
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT --workers 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SETTINGS_MODULE
        value: backend.settings_production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: cleanroom-tracker-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: cleanroom-tracker-redis
          property: connectionString
      - key: WEB_CONCURRENCY
        value: 4
      - key: PORT
        value: 8000
    healthCheckPath: /admin/
    autoDeploy: true
    numInstances: 1

  # Redis Service for WebSockets
  - type: redis
    name: cleanroom-tracker-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # PostgreSQL Database
  - type: pgres
    name: cleanroom-tracker-db
    plan: starter
    ipAllowList: []
    maxConnections: 20
