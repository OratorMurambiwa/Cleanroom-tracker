services:
  - type: web
    name: cleanroom-tracker
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir backend backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SETTINGS_MODULE
        value: backend.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
    healthCheckPath: /
    autoDeploy: true
